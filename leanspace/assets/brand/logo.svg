<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Main leaf gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E7D4F"/>
      <stop offset="50%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#81C784"/>
    </linearGradient>
    <!-- Secondary leaf gradient -->
    <linearGradient id="leafGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1B5E3B"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <!-- Glow gradient -->
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4CAF50" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#4CAF50" stop-opacity="0"/>
    </radialGradient>
    <!-- Shine gradient -->
    <linearGradient id="shine" x1="0%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <!-- Shadow filter -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#2E7D4F" flood-opacity="0.3"/>
    </filter>
    <!-- Inner glow -->
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background circle (optional, for icon use) -->
  <circle cx="256" cy="256" r="240" fill="#F8FAF3"/>
  
  <!-- Ambient glow -->
  <circle cx="256" cy="240" r="180" fill="url(#glow)"/>
  
  <!-- Main leaf shape - large left leaf -->
  <path d="M256 80 C200 80, 120 140, 120 240 C120 340, 200 420, 256 420 C256 420, 256 240, 256 80 Z" 
        fill="url(#leafGrad)" filter="url(#shadow)"/>
  
  <!-- Main leaf shape - large right leaf -->
  <path d="M256 80 C312 80, 392 140, 392 240 C392 340, 312 420, 256 420 C256 420, 256 240, 256 80 Z" 
        fill="url(#leafGrad2)" filter="url(#shadow)"/>
  
  <!-- Center vein -->
  <path d="M256 100 L256 400" 
        stroke="#1B5E3B" stroke-width="3" stroke-linecap="round" opacity="0.4"/>
  
  <!-- Left veins -->
  <path d="M256 160 L190 200" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 220 L170 270" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 280 L185 330" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 340 L210 370" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Right veins -->
  <path d="M256 160 L322 200" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 220 L342 270" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 280 L327 330" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M256 340 L302 370" stroke="#1B5E3B" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  
  <!-- Small sprout at top -->
  <path d="M256 80 C256 60, 240 40, 230 30 C240 35, 250 50, 256 70" 
        fill="#4CAF50" opacity="0.8"/>
  <path d="M256 80 C256 60, 272 40, 282 30 C272 35, 262 50, 256 70" 
        fill="#388E3C" opacity="0.8"/>
  
  <!-- Shine overlay on left leaf -->
  <path d="M256 80 C200 80, 120 140, 120 240 C120 340, 200 420, 256 420 C256 420, 256 240, 256 80 Z" 
        fill="url(#shine)" opacity="0.3"/>
  
  <!-- Water drop accent -->
  <circle cx="210" cy="180" r="8" fill="#81C784" opacity="0.6"/>
  <circle cx="210" cy="180" r="4" fill="#FFFFFF" opacity="0.4"/>
  
  <!-- Small decorative dots -->
  <circle cx="180" cy="300" r="4" fill="#4CAF50" opacity="0.4"/>
  <circle cx="320" cy="160" r="3" fill="#81C784" opacity="0.5"/>
  <circle cx="340" cy="320" r="5" fill="#388E3C" opacity="0.3"/>
  <circle cx="160" cy="200" r="3" fill="#4CAF50" opacity="0.3"/>
</svg>
