name: leanspace

description: Personal discipline and lightweight team check-ins.

publish_to: 'none'

version: 0.1.0+1



environment:

  sdk: ">=3.4.0 <4.0.0"



dependencies:

  flutter:

    sdk: flutter

  flutter_localizations:

    sdk: flutter

  cupertino_icons: ^1.0.8

  flutter_dotenv: ^6.0.1

  flutter_riverpod: ^3.3.2

  flutter_secure_storage: ^10.0.0

  go_router: ^17.3.0

  supabase_flutter: ^2.9.0

  flutter_timezone: ^5.1.0

  intl: ^0.20.2

  google_fonts: ^8.1.0

  share_plus: ^13.1.0

  path_provider: ^2.1.5

  home_widget: ^0.9.3

  in_app_purchase: ^3.2.1

  shared_preferences: ^2.5.3

  flutter_local_notifications: ^22.0.1

  timezone: ^0.11.0

  package_info_plus: 10.0.0




dev_dependencies:

  flutter_test:

    sdk: flutter

  flutter_lints: ^6.0.0

  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.4



flutter_launcher_icons:

  android: true

  ios: false

  image_path: assets/app_logo.png

  adaptive_icon_background: "#F9FAF4"

  adaptive_icon_foreground: assets/app_logo.png


flutter_native_splash:
  color: "#F9FAF4"
  image: assets/app_logo.png
  android: true
  ios: false
  android_12:
    color: "#F9FAF4"
    image: assets/app_logo.png



flutter:

  uses-material-design: true
  generate: true

  assets:

    - .env

    - assets/app_logo.png

    - assets/app_icon.png

    - assets/brand/bloom_tracker_logo.png

    - assets/brand/share_card_reference.png

    - assets/mascot/pot_stitch.png

    - assets/mascot/koala_basic.png

    - assets/mascot/koala_adventure.png

    - assets/mascot/forest_flower.png

    - assets/mascot/forest_watering.png

