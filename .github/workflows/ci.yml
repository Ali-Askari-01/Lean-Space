name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: leanspace

      - name: Analyze code
        run: flutter analyze --no-fatal-infos
        working-directory: leanspace

      - name: Run tests
        run: flutter test
        working-directory: leanspace

  build-apk:
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get
        working-directory: leanspace

      - name: Build APK (debug)
        run: flutter build apk --debug
        working-directory: leanspace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: leanspace/build/app/outputs/flutter-apk/app-debug.apk
